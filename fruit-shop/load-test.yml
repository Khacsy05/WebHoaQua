config:
  target: "http://localhost:3000"
  phases:
    - duration: 30
      arrivalCount: 100
      name: "Simulate 100 concurrent users"
  defaults:
    headers:
      content-type: "application/json"

scenarios:
  - name: "Browse products, log in, and place an order"
    flow:
      # Step 1: Access home page / products API to get available products
      - get:
          url: "/api/products"
          capture:
            - json: "$.data[0]._id"
              as: "productId"

      # Step 2: Login to authenticate and get JWT token
      - post:
          url: "/api/auth/login"
          json:
            username: "khacsy_customer"
            password: "customerpassword"
          capture:
            - json: "$.token"
              as: "authToken"

      # Step 3: Call profile API to fetch the customer ID
      - get:
          url: "/api/auth/me"
          headers:
            authorization: "Bearer {{ authToken }}"
          capture:
            - json: "$.data.customerId"
              as: "customerId"

      # Step 4: Place an order
      - post:
          url: "/api/orders"
          headers:
            authorization: "Bearer {{ authToken }}"
          json:
            customer_id: "{{ customerId }}"
            address: "175 Tây Sơn, Đống Đa, Hà Nội"
            phone: "0987654321"
            items:
              - product_id: "{{ productId }}"
                quantity: 1
